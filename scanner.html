    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-lg mx-auto flex flex-col items-center">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold">Venue Gate Control</h2>
            <p class="theme-text-muted text-sm mt-1">Point camera at a student's ticket QR code.</p>
        </div>

        <!-- Scanner Container -->
        <div class="w-full theme-bg-surface rounded-2xl overflow-hidden shadow-2xl theme-text-main mb-6 relative">
            <div id="qr-reader" class="w-full h-full"></div>
            
            <!-- Result Overlay -->
            <div id="scan-result-overlay" class="absolute inset-0 bg-black/90 hidden flex flex-col items-center justify-center p-6 text-center z-50">
                <div id="result-icon" class="w-24 h-24 mb-4 rounded-full flex items-center justify-center"></div>
                <h3 id="result-title" class="text-3xl font-bold text-white mb-2"></h3>
                <p id="result-msg" class="text-gray-300 text-lg mb-8"></p>
                
                <button id="resume-scan-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full focus:outline-none transition-colors w-full max-w-xs">
                    Scan Next Ticket
                </button>
            </div>
        </div>
        
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
                        const themeSelector = document.getElementById('theme-selector');
            if (themeSelector) {
                themeSelector.value = localStorage.getItem('app-theme') || 'light';
                themeSelector.addEventListener('change', (e) => {
                    const newTheme = e.target.value;
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('app-theme', newTheme);
                });
            }
            const supabase = window.app.supabase;
            const overlay = document.getElementById('scan-result-overlay');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-msg');
            const resumeBtn = document.getElementById('resume-scan-btn');
            
            // =========================================================================
            // HARDWARE CAMERA SCANNER & ENTRY VERIFICATION
            // =========================================================================
            let html5QrcodeScanner;
            // Frame concurrency lock: prevents simultaneous duplicate processing of the same QR code
            let isProcessing = false; 

            // Verify active session
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                document.body.style.visibility = 'visible';
                return;
            }
            
            // Security Gate: Verify scanner access privileges
            // Allowed if user is 'super_admin', an 'organizer', or assigned in 'event_gatekeepers'
            const { data: profile } = await supabase.from('profiles').select('role').eq('email', session.user.email).single();
            const { data: assignments } = await supabase.from('event_gatekeepers').select('event_id').eq('gatekeeper_email', session.user.email);
            
            const isSuper = profile?.role === 'super_admin';
            const isOrg = profile?.role === 'organizer';
            const hasAssignments = assignments && assignments.length > 0;

            if (!isSuper && !isOrg && !hasAssignments) {
                document.querySelector('main').innerHTML = '<div class="text-center py-20 text-red-500 font-bold text-2xl">Access Denied: You do not have scanning privileges.</div>';
                document.body.style.visibility = 'visible';
                return;
            }

            document.body.style.visibility = 'visible';

            /**
             * initScanner:
             * Requests hardware camera access and mounts HTML5-QRCode stream.
             * Targets the phone's environment rear camera (`facingMode: "environment"`).
             */
            function initScanner() {
                Html5Qrcode.getCameras().then(devices => {
                    if (devices && devices.length) {
                        html5QrcodeScanner = new Html5Qrcode("qr-reader");
                        html5QrcodeScanner.start(
                            { facingMode: "environment" }, // Forces rear phone camera
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            onScanSuccess,
                            onScanFailure
                        ).catch(err => console.error("Camera start error:", err));
                    }
                }).catch(err => {
                    console.error("Camera permissions denied:", err);
                    document.getElementById("qr-reader").innerHTML = `<div class="p-8 text-center text-red-500 font-bold">Please grant camera permissions to scan tickets.</div>`;
                });
            }

            /**
             * showResult:
             * Displays fullscreen status overlay for the gatekeeper:
             * - 'success' (Green ✓): Valid ticket, entry granted.
             * - 'used' (Yellow !): Ticket already scanned (duplicate entry attempt).
             * - 'error' (Red ✗): Fake ticket, wrong event, or outside permitted time buffer.
             */
            function showResult(state, title, msg) {
                overlay.classList.remove('hidden');
                resultTitle.textContent = title;
                resultMsg.textContent = msg;

                if (state === 'success') {
                    resultIcon.className = "w-24 h-24 mb-4 rounded-full flex items-center justify-center bg-green-500 text-white text-5xl";
                    resultIcon.innerHTML = "✓";
                } else if (state === 'used') {
                    resultIcon.className = "w-24 h-24 mb-4 rounded-full flex items-center justify-center bg-yellow-500 text-white text-5xl";
                    resultIcon.innerHTML = "!";
                } else {
                    resultIcon.className = "w-24 h-24 mb-4 rounded-full flex items-center justify-center bg-red-600 text-white text-5xl";
                    resultIcon.innerHTML = "✗";
                }
            }

            // Dismiss overlay and unlock camera for the next attendee
            resumeBtn.addEventListener('click', () => {
                overlay.classList.add('hidden');
                isProcessing = false; // Release frame lock
            });

            /**
             * onScanSuccess:
             * Multi-tier cryptographic QR verification pipeline:
             * 1. Prefix format validation (must start with 'TKT-').
             * 2. Database record lookup: Matches qr_code_string in 'tickets' table.
             * 3. Anti-passback / Single-Use Check: Rejects if `is_scanned === true`.
             * 4. Time Window Verification: Checks if current time is within `scan_start_minutes_before` buffer.
             * 5. Marks ticket as scanned (`is_scanned: true`), unlocking certificate accreditation.
             */
            async function onScanSuccess(decodedText, decodedResult) {
                if (isProcessing) return;
                isProcessing = true; // Lock frame to prevent race conditions

                console.log(`Scan decoded: ${decodedText}`);

                // Step 1: Format check
                if (!decodedText.startsWith('TKT-')) {
                    showResult('error', 'Invalid Format', 'This is not a valid campus ticket.');
                    return;
                }

                try {
                    // Step 2: Database lookup joined with parent event configuration
                    const { data: ticketData, error: fetchError } = await supabase
                        .from('tickets')
                        .select('*, events(title, event_date, event_end_date, scan_start_minutes_before)')
                        .eq('qr_code_string', decodedText)
                        .single();

                    if (fetchError || !ticketData) {
                        showResult('error', 'Not Found', 'This ticket does not exist in the database.');
                        return;
                    }

                    const eventTitle = ticketData.events.title;

                    // Step 3: Anti-fraud duplicate check
                    if (ticketData.is_scanned) {
                        showResult('used', 'Already Scanned!', `This ticket for "${eventTitle}" was already used for entry.`);
                        return;
                    }

                    // Step 4: Time window verification
                    const now = new Date();
                    const eventDate = new Date(ticketData.events.event_date);
                    
                    // Buffer window: default 120 minutes before event begins
                    const bufferMs = (ticketData.events.scan_start_minutes_before || 120) * 60000;
                    const scanStartTime = new Date(eventDate.getTime() - bufferMs);
                    
                    let endOfEvent = new Date(eventDate);
                    if (ticketData.events.event_end_date) {
                        endOfEvent = new Date(ticketData.events.event_end_date);
                    } else {
                        endOfEvent.setHours(23, 59, 59, 999);
                    }

                    if (now < scanStartTime) {
                        showResult('error', 'Too Early', `Scanning for "${eventTitle}" starts at ${scanStartTime.toLocaleTimeString()}.`);
                        return;
                    }
                    if (now > endOfEvent) {
                        showResult('error', 'Too Late', `Scanning for "${eventTitle}" ended on ${endOfEvent.toLocaleDateString('en-GB')} at ${endOfEvent.toLocaleTimeString()}.`);
                        return;
                    }

                    // Step 5: Mark ticket as scanned in PostgreSQL
                    const { error: updateError } = await supabase
                        .from('tickets')
                        .update({ is_scanned: true })
                        .eq('id', ticketData.id);

                    if (updateError) throw updateError;

                    // Grant entry!
                    showResult('success', 'Valid Ticket', `Access granted for "${eventTitle}".`);
                    
                } catch (err) {
                    console.error('Database error during scan:', err);
                    showResult('error', 'System Error', 'Could not verify ticket due to network/database error.');
                }
            }

            function onScanFailure(error) {
                // Continuous scanning without interrupting user on unreadable camera frames
            }

            // Mount camera stream on page ready
            initScanner();
        });
    </script>
</body>
</html>
