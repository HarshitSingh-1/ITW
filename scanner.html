<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Scanner - IIITNR Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- HTML5 QR Code Scanner Library via CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom overrides for the scanner UI to look cleaner */
        #qr-reader { border: none !important; }
        #qr-reader__dashboard_section_csr span { display: none; }
        #qr-reader__dashboard_section_swaplink { text-decoration: none !important; color: #3b82f6 !important; font-weight: bold; }
        #qr-reader__camera_selection { margin-bottom: 10px; padding: 5px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 300px; }
        #qr-reader__dashboard_section_csr button { background-color: #2563eb !important; color: white !important; border-radius: 8px; padding: 8px 16px; border: none; cursor: pointer; font-weight: 600; margin-top: 5px;}
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-white">
    <!-- Navbar (Dark mode for scanner) -->
    <nav class="bg-gray-900 shadow-sm border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold text-white">Scanner</h1>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" class="text-gray-400 hover:text-white font-medium px-3 py-2 rounded-md text-sm">Back to Feed</a>
                        <a href="admin.html" class="text-gray-400 hover:text-white font-medium px-3 py-2 rounded-md text-sm">Create Event</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-lg mx-auto flex flex-col items-center">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold">Venue Gate Control</h2>
            <p class="text-gray-400 text-sm mt-1">Point camera at a student's ticket QR code.</p>
        </div>

        <!-- Scanner Container -->
        <div class="w-full bg-white rounded-2xl overflow-hidden shadow-2xl text-gray-800 mb-6 relative">
            <div id="qr-reader" class="w-full h-full"></div>
            
            <!-- Result Overlay -->
            <div id="scan-result-overlay" class="absolute inset-0 bg-black/90 hidden flex flex-col items-center justify-center p-6 text-center z-50">
                <div id="result-icon" class="w-24 h-24 mb-4 rounded-full flex items-center justify-center"></div>
                <h3 id="result-title" class="text-3xl font-bold text-white mb-2"></h3>
                <p id="result-msg" class="text-gray-300 text-lg mb-8"></p>
                
                <button id="resume-scan-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full focus:outline-none transition-colors w-full max-w-xs">
                    Scan Next Ticket
                </button>
            </div>
        </div>
        
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.app.supabase;
            const overlay = document.getElementById('scan-result-overlay');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-msg');
            const resumeBtn = document.getElementById('resume-scan-btn');
            
            let html5QrcodeScanner;
            let isProcessing = false; // Prevent double scanning the same frame

            // Verify auth
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;
            
            // Verify Role
            const { data: profile } = await supabase.from('profiles').select('role').eq('email', session.user.email).single();
            if (!profile || profile.role === 'student') {
                document.querySelector('main').innerHTML = '<div class="text-center py-20 text-red-500 font-bold text-2xl">Access Denied</div>';
                return;
            }

            // Initialize Scanner
            function initScanner() {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "qr-reader",
                    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                    /* verbose= */ false
                );
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }

            function showResult(state, title, msg) {
                overlay.classList.remove('hidden');
                resultTitle.textContent = title;
                resultMsg.textContent = msg;

                if (state === 'success') {
                    resultIcon.className = "w-24 h-24 mb-4 rounded-full flex items-center justify-center bg-green-500 text-white text-5xl";
                    resultIcon.innerHTML = "✓";
                } else if (state === 'used') {
                    resultIcon.className = "w-24 h-24 mb-4 rounded-full flex items-center justify-center bg-yellow-500 text-white text-5xl";
                    resultIcon.innerHTML = "!";
                } else {
                    resultIcon.className = "w-24 h-24 mb-4 rounded-full flex items-center justify-center bg-red-600 text-white text-5xl";
                    resultIcon.innerHTML = "✕";
                }
            }

            resumeBtn.addEventListener('click', () => {
                overlay.classList.add('hidden');
                isProcessing = false; // Allow scanning again
            });

            async function onScanSuccess(decodedText, decodedResult) {
                if (isProcessing) return;
                isProcessing = true; // Lock

                console.log(`Scan decoded: ${decodedText}`);

                // Our tickets follow format TKT-[UUID]-[Random]
                if (!decodedText.startsWith('TKT-')) {
                    showResult('error', 'Invalid Format', 'This is not a valid campus ticket.');
                    return;
                }

                try {
                    // 1. Find the ticket in the database
                    const { data: ticketData, error: fetchError } = await supabase
                        .from('tickets')
                        .select('*, events(title)')
                        .eq('qr_code_string', decodedText)
                        .single();

                    if (fetchError || !ticketData) {
                        showResult('error', 'Not Found', 'This ticket does not exist in the database.');
                        return;
                    }

                    const eventTitle = ticketData.events.title;

                    // 2. Check if already scanned
                    if (ticketData.is_scanned) {
                        showResult('used', 'Already Scanned!', `This ticket for "${eventTitle}" was already used for entry.`);
                        return;
                    }

                    // 3. Mark as scanned
                    const { error: updateError } = await supabase
                        .from('tickets')
                        .update({ is_scanned: true })
                        .eq('id', ticketData.id);

                    if (updateError) throw updateError;

                    // 4. Success!
                    showResult('success', 'Valid Ticket', `Access granted for "${eventTitle}".`);
                    
                } catch (err) {
                    console.error('Database error during scan:', err);
                    showResult('error', 'System Error', 'Could not verify ticket due to network/database error.');
                }
            }

            function onScanFailure(error) {
                // handle scan failure, usually better to ignore and keep scanning
            }

            initScanner();
        });
    </script>
</body>
</html>
