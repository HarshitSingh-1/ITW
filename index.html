<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IIITNR Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold text-gray-900">IIITNR Events</h1>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" class="text-blue-600 font-medium px-3 py-2 rounded-md">Home</a>
                        <a href="wallet.html" class="text-gray-500 hover:text-gray-900 font-medium px-3 py-2 rounded-md">My Wallet</a>
                        <a href="history.html" class="text-gray-500 hover:text-gray-900 font-medium px-3 py-2 rounded-md">History</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-gray-600 hidden md:block"></span>
                    <button id="logout-btn" class="bg-red-50 hover:text-red-700 text-red-600 px-4 py-2 rounded-md text-sm font-medium transition-colors border border-red-200">
                        Log Out
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-7xl mx-auto">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Upcoming Events</h2>
                <p class="text-gray-500 mt-1">Browse and book tickets for campus events.</p>
            </div>
        </div>

        <!-- Notification Banner -->
        <div id="notification-banner" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

        <!-- Events Grid -->
        <div id="events-loading" class="text-center py-12 text-gray-500">
            <svg class="animate-spin h-8 w-8 mx-auto mb-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Loading events...
        </div>
        
        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Event Cards will be injected here by JS -->
        </div>
        
        <div id="no-events-msg" class="hidden text-center py-12 text-gray-500 bg-white rounded-lg border border-gray-200 border-dashed">
            No upcoming events found.
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Phase 2: Feed & Booking Logic
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.app.supabase;
            const eventsGrid = document.getElementById('events-grid');
            const loading = document.getElementById('events-loading');
            const noEventsMsg = document.getElementById('no-events-msg');
            const notification = document.getElementById('notification-banner');
            const emailDisplay = document.getElementById('user-email-display');

            // Wait for session to initialize
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return; // app.js will handle redirect

            const userEmail = session.user.email;
            if(emailDisplay) emailDisplay.textContent = userEmail;

            function showNotification(msg, type = 'success') {
                notification.textContent = msg;
                notification.className = `mb-6 p-4 rounded-lg text-sm font-medium block ${type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'}`;
                setTimeout(() => notification.classList.add('hidden'), 5000);
            }

            async function fetchEvents() {
                try {
                    // Fetch future events ordered by date
                    const { data: events, error } = await supabase
                        .from('events')
                        .select('*')
                        .gte('event_date', new Date().toISOString())
                        .order('event_date', { ascending: true });

                    if (error) throw error;

                    loading.classList.add('hidden');

                    if (events.length === 0) {
                        noEventsMsg.classList.remove('hidden');
                        return;
                    }

                    eventsGrid.classList.remove('hidden');
                    eventsGrid.innerHTML = ''; // Clear existing

                    events.forEach(event => {
                        const dateObj = new Date(event.event_date);
                        const dateString = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                        const timeString = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                        
                        const isSoldOut = event.tickets_sold >= event.total_capacity;
                        const capacityPercentage = Math.min(100, (event.tickets_sold / event.total_capacity) * 100);

                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow';
                        
                        card.innerHTML = `
                            <div class="p-6 flex-grow">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-gray-900 leading-tight">${event.title}</h3>
                                    ${isSoldOut ? '<span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-0.5 rounded">Sold Out</span>' : ''}
                                </div>
                                <div class="text-sm text-blue-600 font-medium mb-4">
                                    <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${dateString} at ${timeString}
                                </div>
                                <div class="text-sm text-gray-600 mb-4 flex items-center">
                                    <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    ${event.venue}
                                </div>
                                <p class="text-gray-600 text-sm mb-6 line-clamp-2">${event.description || 'No description provided.'}</p>
                                
                                <!-- Capacity Meter -->
                                <div class="mt-auto">
                                    <div class="flex justify-between text-xs text-gray-500 mb-1 font-medium">
                                        <span>Capacity</span>
                                        <span>${event.tickets_sold} / ${event.total_capacity}</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div class="h-2 rounded-full ${capacityPercentage > 85 ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${capacityPercentage}%"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50">
                                <button 
                                    onclick="bookTicket('${event.id}', '${event.title}')" 
                                    class="w-full font-semibold py-2 px-4 rounded-lg focus:outline-none transition-colors ${isSoldOut ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'}"
                                    ${isSoldOut ? 'disabled' : ''}>
                                    ${isSoldOut ? 'Unavailable' : 'Book Ticket'}
                                </button>
                            </div>
                        `;
                        eventsGrid.appendChild(card);
                    });
                } catch (error) {
                    console.error('Error fetching events:', error);
                    showNotification('Failed to load events. Please try again.', 'error');
                }
            }

            // Expose global function for the inline onclick handler
            window.bookTicket = async function(eventId, eventTitle) {
                // Confirm action
                if (!confirm(`Are you sure you want to book a ticket for "${eventTitle}"?`)) return;

                // Generate a unique unguessable QR string
                // Format: TKT-[EventUUID]-[RandomString]
                const randomStr = Math.random().toString(36).substring(2, 10);
                const qrString = `TKT-${eventId}-${randomStr}`;

                try {
                    // Call the RPC function defined in the SQL schema
                    const { data: success, error } = await supabase.rpc('book_ticket_safe', {
                        p_event_id: eventId,
                        p_student_email: userEmail,
                        p_qr_string: qrString
                    });

                    if (error) {
                        // RPC throws errors if they fail constraint checks sometimes
                        throw error;
                    }

                    if (success) {
                        showNotification(`Successfully booked ticket for ${eventTitle}! Check your wallet.`);
                        fetchEvents(); // Refresh capacity meters
                    } else {
                        showNotification(`Failed to book ticket. The event might be sold out.`, 'error');
                        fetchEvents(); // Refresh to show it as sold out
                    }

                } catch (err) {
                    console.error('Booking error:', err);
                    
                    // Handle unique constraint error if the student already booked (assuming we add a unique constraint on event_id + student_email)
                    if (err.code === '23505') {
                        showNotification(`You already have a ticket for this event.`, 'error');
                    } else {
                        showNotification(`An error occurred while booking.`, 'error');
                    }
                }
            };

            // Initial load
            fetchEvents();
        });
    </script>
</body>
</html>
