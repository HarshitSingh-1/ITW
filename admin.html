<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IIITNR Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-gray-900 shadow-sm border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold text-white">Admin Portal</h1>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" class="text-gray-400 hover:text-white font-medium px-3 py-2 rounded-md text-sm">Back to Feed</a>
                        <a href="admin.html" class="text-blue-400 font-medium px-3 py-2 rounded-md text-sm">Create Event</a>
                        <a href="scanner.html" class="text-gray-400 hover:text-white font-medium px-3 py-2 rounded-md text-sm">Gate Scanner</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-gray-300 hidden md:block"></span>
                    <button id="logout-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-md text-sm font-medium transition-colors border border-gray-700">
                        Log Out
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-3xl mx-auto">
        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Create New Event</h2>
            <p class="text-gray-500 mt-1">Publish an event to the campus feed.</p>
        </div>

        <div id="notification-banner" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

        <form id="create-event-form" class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200">
            <div class="space-y-6">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">Event Title *</label>
                    <input type="text" id="title" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="event_date" class="block text-sm font-medium text-gray-700">Date & Time *</label>
                        <input type="datetime-local" id="event_date" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="total_capacity" class="block text-sm font-medium text-gray-700">Total Capacity *</label>
                        <input type="number" id="total_capacity" min="1" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label for="venue" class="block text-sm font-medium text-gray-700">Venue *</label>
                    <input type="text" id="venue" placeholder="e.g. Main Auditorium" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
            </div>

            <div class="mt-8">
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Publish Event
                </button>
            </div>
        </form>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.app.supabase;
            const form = document.getElementById('create-event-form');
            const submitBtn = document.getElementById('submit-btn');
            const notification = document.getElementById('notification-banner');
            const emailDisplay = document.getElementById('user-email-display');

            // Session check
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;
            const userEmail = session.user.email;
            if(emailDisplay) emailDisplay.textContent = userEmail;

            function showNotification(msg, type = 'success') {
                notification.textContent = msg;
                notification.className = `mb-6 p-4 rounded-lg text-sm font-medium block ${type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'}`;
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if(type === 'success') {
                    setTimeout(() => notification.classList.add('hidden'), 5000);
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Publishing...';

                // Format the local datetime to ISO for postgres
                const dateVal = new Date(document.getElementById('event_date').value).toISOString();

                const newEvent = {
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    event_date: dateVal,
                    venue: document.getElementById('venue').value,
                    total_capacity: parseInt(document.getElementById('total_capacity').value),
                    organizer_email: userEmail // Bind securely
                };

                try {
                    const { error } = await supabase.from('events').insert([newEvent]);
                    
                    if (error) throw error;
                    
                    showNotification('Event successfully published! It is now live on the feed.');
                    form.reset();
                    
                } catch (error) {
                    console.error('Error creating event:', error);
                    showNotification(`Failed to create event: ${error.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Publish Event';
                }
            });
        });
    </script>
</body>
</html>
