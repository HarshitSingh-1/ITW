<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet - IIITNR Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .qr-code-container img {
            margin: 0 auto;
        }
    </style>
</head>
<body class="premium-bg">
    <!-- Navbar -->
    <nav class="glass-nav sticky top-0 z-50 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold text-gray-900">IIITNR Events</h1>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" class="text-gray-500 hover:text-gray-900 font-medium px-3 py-2 rounded-md">Home</a>
                        <a href="wallet.html" class="text-blue-600 font-medium px-3 py-2 rounded-md">My Wallet</a>
                        <a href="history.html" class="text-gray-500 hover:text-gray-900 font-medium px-3 py-2 rounded-md">History</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-gray-600 hidden md:block"></span>
                    <button id="logout-btn" class="bg-red-50 hover:text-red-700 text-red-600 px-4 py-2 rounded-md text-sm font-medium transition-colors border border-red-200">
                        Log Out
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-7xl mx-auto">
        <div class="mb-6">
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Digital Wallet</h2>
            <p class="text-gray-500 mt-1">Present these QR codes at the gate for entry.</p>
        </div>

        <div id="tickets-loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="animate-pulse bg-white rounded-3xl h-[450px] shadow-sm border border-gray-100"></div>
            <div class="animate-pulse bg-white rounded-3xl h-[450px] shadow-sm border border-gray-100 hidden md:block"></div>
        </div>
        <!-- old loader deleted by regex -->
            </div>
        
        <div id="tickets-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden">
            <!-- Ticket Cards injected here -->
        </div>
        
        <div id="no-tickets-msg" class="hidden text-center py-12 text-gray-500 bg-white rounded-lg border border-gray-200 border-dashed">
            You don't have any active tickets yet. <br>
            <a href="index.html" class="text-blue-600 hover:underline mt-2 inline-block">Browse upcoming events</a>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.app.supabase;
            const ticketsGrid = document.getElementById('tickets-grid');
            const loading = document.getElementById('tickets-loading');
            const noTicketsMsg = document.getElementById('no-tickets-msg');
            const emailDisplay = document.getElementById('user-email-display');

            // Wait for session
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return; // app.js handles redirect
            const userEmail = session.user.email;
            if(emailDisplay) emailDisplay.textContent = userEmail;

            async function fetchTickets() {
                try {
                    // Fetch tickets joined with event data
                    // Only fetch tickets where the event hasn't happened yet (or keep all and let history.html handle past ones)
                    // For the wallet, usually you only want active ones. Let's fetch where event_date >= now.
                    const { data: tickets, error } = await supabase
                        .from('tickets')
                        .select('*, events!inner(*)') // !inner ensures we only get tickets where the event exists
                        .eq('student_email', userEmail)
                        .gte('events.event_date', new Date().toISOString())
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    loading.classList.add('hidden');

                    if (tickets.length === 0) {
                        noTicketsMsg.classList.remove('hidden');
                        return;
                    }

                    ticketsGrid.classList.remove('hidden');

                    tickets.forEach(ticket => {
                        const event = ticket.events;
                        const dateObj = new Date(event.event_date);
                        const endDateObj = event.event_end_date ? new Date(event.event_end_date) : new Date(dateObj.getTime() + (2 * 60 * 60 * 1000));
                        
                        const dateString = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                        let timeString = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                        if (event.event_end_date) {
                            const eD = new Date(event.event_end_date);
                            if (dateObj.toDateString() === eD.toDateString()) {
                                timeString += ` - ${eD.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
                            }
                        }

                        // Google Calendar URL formatting
                        function formatGCalDate(d) { return d.toISOString().replace(/-|:|\.\d\d\d/g, ""); }
                        const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(event.title)}&dates=${formatGCalDate(dateObj)}/${formatGCalDate(endDateObj)}&details=${encodeURIComponent(event.description || 'College Event')}&location=${encodeURIComponent(event.venue)}`;

                        const cardWrap = document.createElement('div');
                        cardWrap.className = 'flex flex-col gap-3';
                        
                        const card = document.createElement('div');
                        card.id = `ticket-card-${ticket.id}`;
                        card.className = 'bg-white rounded-[32px] shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] overflow-hidden flex flex-col relative transform transition-transform hover:-translate-y-2 duration-300';
                        
                        // Scanned watermark/overlay
                        let scannedOverlay = '';
                        if (ticket.is_scanned) {
                            scannedOverlay = `
                                <div class="absolute inset-0 bg-white/70 backdrop-blur-[2px] z-10 flex items-center justify-center">
                                    <div class="border-4 border-red-500 text-red-500 px-6 py-2 rounded-lg font-bold text-2xl transform -rotate-12 tracking-widest uppercase">
                                        Used
                                    </div>
                                </div>
                            `;
                        }

                        // Ticket ID (first 8 chars for aesthetics)
                        const shortId = ticket.id.substring(0, 8).toUpperCase();

                        card.innerHTML = `
                            ${scannedOverlay}
                            
                            <!-- Top Section -->
                            <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-900 text-white relative flex-grow overflow-hidden">
                                <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                                <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
                                <div class="relative z-10">
                                    <div class="flex justify-between items-start mb-4">
                                        <h3 class="text-2xl font-black leading-tight line-clamp-2">${event.title}</h3>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest mb-0.5">Date</p>
                                            <p class="font-medium text-sm">${dateString}</p>
                                        </div>
                                        <div>
                                            <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest mb-0.5">Time</p>
                                            <p class="font-medium text-sm">${timeString}</p>
                                        </div>
                                    </div>
                                    <div class="mt-4">
                                        <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest mb-0.5">Venue</p>
                                        <p class="font-medium text-sm truncate">${event.venue}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Perforated separator -->
                            <div class="relative bg-white h-8 flex items-center -my-4 z-20">
                                <div class="w-8 h-8 bg-gray-100 rounded-full absolute -left-4 shadow-inner"></div>
                                <div class="w-8 h-8 bg-gray-100 rounded-full absolute -right-4 shadow-inner"></div>
                                <div class="w-full border-t-[3px] border-dashed border-gray-200 mx-6"></div>
                            </div>

                            <!-- Bottom section (QR Code) -->
                            <div class="p-6 bg-white text-center flex flex-col items-center">
                                <p class="text-xs text-gray-500 mb-4 font-mono">TICKET #${shortId}</p>
                                
                                <!-- Container for QRCode.js to mount -->
                                <div id="qr-${ticket.id}" class="qr-code-container mb-4 p-2 border-2 border-gray-100 rounded-lg inline-block"></div>
                                
                                <p class="text-xs text-gray-400">Present this code at the venue gate</p>
                            </div>
                        `;

                        // Action Buttons
                        const actions = document.createElement('div');
                        actions.className = 'grid grid-cols-2 gap-2 mt-1';
                        actions.innerHTML = `
                            <a href="${gCalUrl}" target="_blank" class="text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg text-sm flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                Calendar
                            </a>
                            <button id="download-${ticket.id}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg text-sm flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Download
                            </button>
                        `;

                        cardWrap.appendChild(card);
                        cardWrap.appendChild(actions);
                        ticketsGrid.appendChild(cardWrap);

                        // Generate QR Code inside the specific container
                        if (!ticket.is_scanned) {
                            new QRCode(document.getElementById(`qr-${ticket.id}`), {
                                text: ticket.qr_code_string,
                                width: 160,
                                height: 160,
                                colorDark : "#000000",
                                colorLight : "#ffffff",
                                correctLevel : QRCode.CorrectLevel.M
                            });
                        }

                        // Download Logic
                        document.getElementById(`download-${ticket.id}`).addEventListener('click', () => {
                            html2canvas(document.getElementById(`ticket-card-${ticket.id}`), {
                                scale: 2, // High resolution
                                backgroundColor: null
                            }).then(canvas => {
                                const link = document.createElement('a');
                                link.download = `Ticket_${event.title.replace(/\s+/g, '_')}.png`;
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            });
                        });
                    });

                } catch (error) {
                    console.error('Error fetching tickets:', error);
                    loading.textContent = 'Failed to load tickets. Please try again.';
                    loading.classList.add('text-red-500');
                }
            }

            fetchTickets();
        });
    </script>
</body>
</html>
