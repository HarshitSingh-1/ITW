<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet - BookMyCollege</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            base: 'var(--bg-base)',
                            surface: 'var(--bg-surface)',
                            text: 'var(--text-main)',
                            muted: 'var(--text-muted)',
                            border: 'var(--border-color)',
                            accent: 'var(--accent-main)',
                            hover: 'var(--accent-hover)'
                        }
                    }
                }
            }
        }
    </script>
    <script>
        const savedTheme = localStorage.getItem('app-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="certificate.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .qr-code-container img {
            margin: 0 auto;
        }
    </style>
</head>
<body class="theme-bg-base min-h-screen theme-text-main transition-colors duration-300">
    <!-- Navbar (Responsive Desktop & Mobile) -->
    <nav class="theme-nav-glass backdrop-blur-xl shadow-[0_4px_30px_rgba(0,0,0,0.02)] border-b theme-border sticky top-0 z-50 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <!-- Brand Logo -->
                    <h1 class="text-2xl font-black text-theme-accent tracking-tighter cursor-pointer hover:scale-105 transition-transform" onclick="window.location.href='index.html'">BookMy<span class="text-indigo-600 dark:text-indigo-400">College</span></h1>
                    <!-- Desktop Navigation Links (Visible on screens >= 768px) -->
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" class="theme-text-muted hover:text-theme-text font-medium px-3 py-2 transition-colors">Home</a>
                        <a href="wallet.html" class="text-theme-accent font-bold px-3 py-2">My Wallet</a>
                        <a href="history.html" class="theme-text-muted hover:text-theme-text font-medium px-3 py-2 transition-colors">History</a>
                        <a href="admin.html" class="admin-link text-red-600 hover:text-red-800 font-bold px-3 py-2 hidden transition-colors">Admin Portal</a>
                    </div>
                </div>
                <!-- Right Action Bar: Theme Switcher, Email Display, Logout & Mobile Hamburger Toggle -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <!-- Theme Switcher (Light / Dark) -->
                    <select id="theme-selector" class="theme-bg-surface theme-text-main theme-border border rounded-lg text-sm px-2 py-1 font-medium focus:outline-none focus:ring-2 focus:ring-theme-accent cursor-pointer">
                        <option value="light">&#x2600;&#xFE0F; Light</option>
                        <option value="dark">&#x1F319; Dark</option>
                    </select>

                    <span id="user-email-display" class="text-sm theme-text-muted hidden md:block font-medium"></span>
                    <button id="logout-btn" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm font-bold transition-colors">Log Out</button>

                    <!-- Mobile Hamburger Button (Visible on phones < 768px) -->
                    <button id="mobile-menu-btn" class="md:hidden p-2 rounded-xl border theme-border theme-text-main hover:theme-bg-surface focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" aria-label="Toggle Navigation Menu">
                        <svg id="hamburger-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        <svg id="close-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Navigation Dropdown Menu -->
            <div id="mobile-menu" class="hidden md:hidden border-t theme-border py-3 px-2 space-y-1.5 theme-bg-surface rounded-b-2xl shadow-xl">
                <a href="index.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-medium theme-text-muted hover:theme-text-main hover:theme-bg-base transition-colors">
                    <span class="text-base">🏠</span> Home Feed
                </a>
                <a href="wallet.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-bold text-blue-600 bg-blue-50 dark:bg-blue-950/40">
                    <span class="text-base">🎟️</span> My Ticket Wallet
                </a>
                <a href="history.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-medium theme-text-muted hover:theme-text-main hover:theme-bg-base transition-colors">
                    <span class="text-base">📜</span> Event History
                </a>
                <a href="admin.html" class="admin-link hidden flex items-center gap-2.5 px-3 py-2.5 rounded-xl font-bold text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors">
                    <span class="text-base">⚡</span> Admin & Organizer Portal
                </a>
                <div class="pt-2 border-t theme-border mt-2 px-3">
                    <span class="user-email-mobile text-xs theme-text-muted block truncate font-mono"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-7xl mx-auto">
        <div class="mb-6">
            <h2 class="text-3xl font-extrabold theme-text-main tracking-tight">Digital Wallet</h2>
            <p class="theme-text-muted mt-1">Present these QR codes at the gate for entry.</p>
        </div>

        <div id="tickets-loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="animate-pulse theme-bg-surface rounded-3xl h-[450px] shadow-sm border theme-border"></div>
            <div class="animate-pulse theme-bg-surface rounded-3xl h-[450px] shadow-sm border theme-border hidden md:block"></div>
        </div>
        
        <div id="tickets-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden">
            <!-- Ticket Cards injected here -->
        </div>
        
        <div id="no-tickets-msg" class="hidden text-center py-12 theme-text-muted theme-bg-surface rounded-lg border theme-border border-dashed">
            You don't have any active tickets yet. <br>
            <a href="index.html" class="text-blue-600 hover:underline mt-2 inline-block">Browse upcoming events</a>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
                        const themeSelector = document.getElementById('theme-selector');
            if (themeSelector) {
                themeSelector.value = localStorage.getItem('app-theme') || 'light';
                themeSelector.addEventListener('change', (e) => {
                    const newTheme = e.target.value;
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('app-theme', newTheme);
                });
            }
            const supabase = window.app.supabase;
            const ticketsGrid = document.getElementById('tickets-grid');
            const loading = document.getElementById('tickets-loading');
            const noTicketsMsg = document.getElementById('no-tickets-msg');
            const emailDisplay = document.getElementById('user-email-display');

            // =========================================================================
            // DIGITAL WALLET CONTROLLER
            // =========================================================================
            // Verify active Supabase user session
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return; // Handled by global auth guard in app.js
            const userEmail = session.user.email;
            if(emailDisplay) emailDisplay.textContent = userEmail;

            // Fetch student's real full name from 'profiles' for personalized certificate generation
            let currentStudentName = userEmail.split('@')[0];
            try {
                const { data: prof } = await supabase.from('profiles').select('full_name').eq('email', userEmail).single();
                if (prof && prof.full_name) currentStudentName = prof.full_name;
            } catch (pErr) {
                console.warn('Could not fetch student name:', pErr);
            }

            /**
             * fetchTickets:
             * Queries the student's active event passes from PostgreSQL using Supabase.
             * 1. Performs an inner join `events!inner(*)` ensuring tickets correspond to valid events.
             * 2. Filters for upcoming events (event_date >= yesterday buffer).
             * 3. Renders realistic perforated ticket cards with live QR codes.
             * 4. Enables Google Calendar integration and Participation Certificate download.
             */
            async function fetchTickets() {
                try {
                    const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
                    
                    // Supabase Query: Relational Inner Join on tickets & events
                    const { data: tickets, error } = await supabase
                        .from('tickets')
                        .select('*, events!inner(*)') // !inner ensures orphaned tickets are discarded
                        .eq('student_email', userEmail)
                        .gte('events.event_date', yesterday)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    loading.classList.add('hidden');

                    if (tickets.length === 0) {
                        noTicketsMsg.classList.remove('hidden');
                        return;
                    }

                    ticketsGrid.classList.remove('hidden');

                    tickets.forEach(ticket => {
                        const event = ticket.events;
                        const dateObj = new Date(event.event_date);
                        const endDateObj = event.event_end_date ? new Date(event.event_end_date) : new Date(dateObj.getTime() + (2 * 60 * 60 * 1000));
                        
                        let dateString = dateObj.toLocaleDateString('en-GB');
                        let timeString = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                        if (event.event_end_date) {
                            const eD = new Date(event.event_end_date);
                            if (dateObj.toDateString() === eD.toDateString()) {
                                timeString += ` - ${eD.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
                            } else {
                                dateString += ` to ${eD.toLocaleDateString('en-GB')}`;
                                timeString += ` - ${eD.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
                            }
                        }

                        // =====================================================================
                        // GOOGLE CALENDAR DEEP LINK GENERATION
                        // =====================================================================
                        // Converts dates to Google Calendar template format (YYYYMMDDTHHMMSSZ)
                        function formatGCalDate(d) { return d.toISOString().replace(/-|:|\.\d\d\d/g, ""); }
                        const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(event.title)}&dates=${formatGCalDate(dateObj)}/${formatGCalDate(endDateObj)}&details=${encodeURIComponent(event.description || 'College Event')}&location=${encodeURIComponent(event.venue)}`;

                        const cardWrap = document.createElement('div');
                        cardWrap.className = 'flex flex-col gap-3';
                        
                        // Perforated Ticket Card DOM
                        const card = document.createElement('div');
                        card.id = `ticket-card-${ticket.id}`;
                        card.className = 'theme-bg-surface rounded-[32px] shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] overflow-hidden flex flex-col relative transform transition-transform hover:-translate-y-2 duration-300';
                        
                        // Scanned watermark overlay (Shown once gatekeeper scans the student in)
                        let scannedOverlay = '';
                        if (ticket.is_scanned) {
                            scannedOverlay = `
                                <div class="absolute inset-0 theme-bg-surface/70 backdrop-blur-[2px] z-10 flex items-center justify-center">
                                    <div class="border-4 border-red-500 text-red-500 px-6 py-2 rounded-lg font-bold text-2xl transform -rotate-12 tracking-widest uppercase">
                                        Used
                                    </div>
                                </div>
                            `;
                        }

                        // Ticket ID (first 8 characters for visual ticket stub)
                        const shortId = ticket.id.substring(0, 8).toUpperCase();

                        card.innerHTML = `
                            ${scannedOverlay}
                            
                            <!-- Top Section: Event Banner & Date/Time/Venue -->
                            <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-900 text-white relative flex-grow overflow-hidden">
                                <div class="absolute -right-10 -top-10 w-32 h-32 theme-bg-surface/10 rounded-full blur-2xl"></div>
                                <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
                                <div class="relative z-10">
                                    <div class="flex justify-between items-start mb-4">
                                        <h3 class="text-2xl font-black leading-tight line-clamp-2">${event.title}</h3>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest mb-0.5">Date</p>
                                            <p class="font-medium text-sm">${dateString}</p>
                                        </div>
                                        <div>
                                            <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest mb-0.5">Time</p>
                                            <p class="font-medium text-sm">${timeString}</p>
                                        </div>
                                    </div>
                                    <div class="mt-4">
                                        <p class="text-blue-200 text-[10px] font-bold uppercase tracking-widest mb-0.5">Venue</p>
                                        <p class="font-medium text-sm truncate">${event.venue}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Perforated separator with cut-out notches -->
                            <div class="relative theme-bg-surface h-8 flex items-center -my-4 z-20">
                                <div class="w-8 h-8 theme-bg-base rounded-full absolute -left-4 shadow-inner"></div>
                                <div class="w-8 h-8 theme-bg-base rounded-full absolute -right-4 shadow-inner"></div>
                                <div class="w-full border-t-[3px] border-dashed theme-border mx-6"></div>
                            </div>

                            <!-- Bottom section: High-Resolution Scannable QR Code -->
                            <div class="p-6 theme-bg-surface text-center flex flex-col items-center">
                                <p class="text-xs theme-text-muted mb-4 font-mono">TICKET #${shortId}</p>
                                
                                <!-- Container for QRCode.js to mount -->
                                <div id="qr-${ticket.id}" class="qr-code-container mb-4 p-2 border-2 theme-border rounded-lg inline-block"></div>
                                
                                <p class="text-xs theme-text-muted">Present this code at the venue gate</p>
                            </div>
                        `;

                        // =====================================================================
                        // CONDITIONAL CERTIFICATE OF PARTICIPATION
                        // =====================================================================
                        // Unlocked only if event offered certificates AND student physically checked in (is_scanned)
                        let certBtnHtml = '';
                        if (event.has_certificate && ticket.is_scanned) {
                            certBtnHtml = `
                                <button id="cert-${ticket.id}" class="col-span-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm transition active:scale-95 mb-1">
                                    <span>🎓</span> View & Download Certificate
                                </button>
                            `;
                        }

                        // Auxiliary Action Buttons: Google Calendar sync & PNG card download
                        const actions = document.createElement('div');
                        actions.className = 'grid grid-cols-2 gap-2 mt-1';
                        actions.innerHTML = `
                            ${certBtnHtml}
                            <a href="${gCalUrl}" target="_blank" class="text-center theme-bg-base hover:bg-gray-200 theme-text-main font-bold py-2 px-4 rounded-lg text-sm flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                Calendar
                            </a>
                            <button id="download-${ticket.id}" class="theme-bg-base hover:bg-gray-200 theme-text-main font-bold py-2 px-4 rounded-lg text-sm flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Download
                            </button>
                        `;

                        cardWrap.appendChild(card);
                        cardWrap.appendChild(actions);
                        ticketsGrid.appendChild(cardWrap);

                        // Certificate Modal Trigger
                        const certBtn = document.getElementById(`cert-${ticket.id}`);
                        if (certBtn) {
                            certBtn.onclick = () => {
                                if (window.CertificateGenerator) {
                                    window.CertificateGenerator.preview({
                                        studentName: currentStudentName,
                                        eventTitle: event.title,
                                        eventDate: dateString,
                                        venue: event.venue || 'IIIT Naya Raipur',
                                        certificateId: `BMC-CERT-${ticket.id.substring(0, 8).toUpperCase()}`
                                    });
                                }
                            };
                        }

                        // Generate cryptographic QR code for gatekeeper verification
                        if (!ticket.is_scanned) {
                            new QRCode(document.getElementById(`qr-${ticket.id}`), {
                                text: ticket.qr_code_string,
                                width: 160,
                                height: 160,
                                colorDark : "#000000",
                                colorLight : "#ffffff",
                                correctLevel : QRCode.CorrectLevel.M
                            });
                        }

                        // Client-side Ticket PNG Download via html2canvas (2x Retina resolution)
                        document.getElementById(`download-${ticket.id}`).addEventListener('click', () => {
                            html2canvas(document.getElementById(`ticket-card-${ticket.id}`), {
                                scale: 2, // Crisp 2x retina export
                                backgroundColor: null
                            }).then(canvas => {
                                const link = document.createElement('a');
                                link.download = `Ticket_${event.title.replace(/\s+/g, '_')}.png`;
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            });
                        });
                    });

                } catch (error) {
                    console.error('Error fetching tickets:', error);
                    loading.textContent = 'Failed to load tickets. Please try again.';
                    loading.classList.add('text-red-500');
                }
            }

            // Initial load
            fetchTickets();
        });
    </script>
</body>
</html>
