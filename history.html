<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - IIITNR Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="premium-bg">
    <!-- Navbar -->
    <nav class="glass-nav sticky top-0 z-50 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold text-gray-900">IIITNR Events</h1>
                    <div class="hidden md:flex space-x-4">
                        <a href="index.html" class="text-gray-500 hover:text-gray-900 font-medium px-3 py-2 rounded-md text-sm">Home</a>
                        <a href="wallet.html" class="text-gray-500 hover:text-gray-900 font-medium px-3 py-2 rounded-md text-sm">My Wallet</a>
                        <a href="history.html" class="text-blue-600 font-medium px-3 py-2 rounded-md text-sm">History</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-gray-600 hidden md:block"></span>
                    <button id="logout-btn" class="bg-red-50 hover:text-red-700 text-red-600 px-4 py-2 rounded-md text-sm font-medium transition-colors border border-red-200">
                        Log Out
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-7xl mx-auto space-y-12">
        
        <!-- Section: Events Attended -->
        <section>
            <div class="mb-6 border-b border-gray-200 pb-4">
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Events I Attended</h2>
                <p class="text-gray-500 mt-1">A log of all the campus events you've participated in.</p>
            </div>

            <div id="attended-loading" class="text-gray-500 text-sm">Loading past tickets...</div>
            <div id="attended-empty" class="hidden text-gray-500 text-sm italic">You haven't attended any past events.</div>
            
            <div id="attended-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Section: Events Organized -->
        <section>
            <div class="mb-6 border-b border-gray-200 pb-4">
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Events I Organized</h2>
                <p class="text-gray-500 mt-1">Past events that you created and hosted.</p>
            </div>

            <div id="organized-loading" class="text-gray-500 text-sm">Loading past events...</div>
            <div id="organized-empty" class="hidden text-gray-500 text-sm italic">You haven't organized any events yet.</div>
            
            <div id="organized-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- Injected via JS -->
            </div>
        </section>

    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const supabase = window.app.supabase;
            const emailDisplay = document.getElementById('user-email-display');

            // Wait for session
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;
            const userEmail = session.user.email;
            if(emailDisplay) emailDisplay.textContent = userEmail;

            const nowIso = new Date().toISOString();

            // Function to format date nicely
            const formatDateTime = (isoString) => {
                const d = new Date(isoString);
                return `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })} at ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
            };

            // 1. Fetch Past Tickets (Attended)
            async function fetchAttended() {
                try {
                    const { data: tickets, error } = await supabase
                        .from('tickets')
                        .select('*, events!inner(*)')
                        .eq('student_email', userEmail)
                        .lt('events.event_date', nowIso)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    document.getElementById('attended-loading').classList.add('hidden');

                    if (!tickets || tickets.length === 0) {
                        document.getElementById('attended-empty').classList.remove('hidden');
                        return;
                    }

                    const grid = document.getElementById('attended-grid');
                    grid.classList.remove('hidden');

                    tickets.forEach(ticket => {
                        const event = ticket.events;
                        const card = document.createElement('div');
                        card.className = 'glass-card p-5 rounded-2xl shadow-sm opacity-90 transition-transform hover:scale-[1.02]'; // Slightly faded to imply past
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-gray-900">${event.title}</h3>
                                ${ticket.is_scanned 
                                    ? '<span class="text-xs font-semibold text-green-700 bg-green-100 px-2 py-1 rounded">Attended</span>'
                                    : '<span class="text-xs font-semibold text-red-700 bg-red-100 px-2 py-1 rounded">Missed</span>'
                                }
                            </div>
                            <div class="text-sm text-gray-500 mb-1">${formatDateTime(event.event_date)}</div>
                            <div class="text-sm text-gray-500">${event.venue}</div>
                        `;
                        grid.appendChild(card);
                    });
                } catch (err) {
                    console.error('Error fetching attended:', err);
                    document.getElementById('attended-loading').textContent = 'Failed to load data.';
                }
            }

            // 2. Fetch Past Events Organized
            async function fetchOrganized() {
                try {
                    const { data: events, error } = await supabase
                        .from('events')
                        .select('*')
                        .eq('organizer_email', userEmail)
                        .lt('event_date', nowIso)
                        .order('event_date', { ascending: false });

                    if (error) throw error;

                    document.getElementById('organized-loading').classList.add('hidden');

                    if (!events || events.length === 0) {
                        document.getElementById('organized-empty').classList.remove('hidden');
                        return;
                    }

                    const grid = document.getElementById('organized-grid');
                    grid.classList.remove('hidden');

                    events.forEach(event => {
                        const attendanceRate = event.total_capacity > 0 
                            ? Math.round((event.tickets_sold / event.total_capacity) * 100) 
                            : 0;

                        const card = document.createElement('div');
                        card.className = 'glass-panel p-5 rounded-2xl text-gray-900 shadow-lg border border-white/80 transition-transform hover:-translate-y-1';
                        card.innerHTML = `
                            <h3 class="font-bold text-lg mb-1">${event.title}</h3>
                            <div class="text-sm text-gray-500 font-medium mb-4">${formatDateTime(event.event_date)}</div>
                            
                            <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-gray-300/50">
                                <div>
                                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Tickets Sold</div>
                                    <div class="font-semibold text-xl">${event.tickets_sold} <span class="text-sm text-gray-500">/ ${event.total_capacity}</span></div>
                                </div>
                                <div>
                                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Fill Rate</div>
                                    <div class="font-semibold text-xl text-blue-400">${attendanceRate}%</div>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } catch (err) {
                    console.error('Error fetching organized:', err);
                    document.getElementById('organized-loading').textContent = 'Failed to load data.';
                }
            }

            fetchAttended();
            fetchOrganized();
        });
    </script>
</body>
</html>
